# Wokwi simulation of the Rust firmware (VS Code extension "Wokwi Simulator" or wokwi-cli).
# Build first with `cargo build --release`, then F1 -> "Wokwi: Start Simulator" in this folder,
# or from the project folder: wokwi-cli rust --scenario ../wokwi/scenarios/mode-switch.yaml --timeout 20000
[wokwi]
version  = 1
firmware = '../../target/xtensa-esp32s3-none-elf/release/two-buttons'
elf      = '../../target/xtensa-esp32s3-none-elf/release/two-buttons'
