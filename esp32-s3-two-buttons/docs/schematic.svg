<line x1="856" y1="664" x2="864" y2="664" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="874" y="410.0" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GND</text>
<text x="930" y="110" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Виходи (світлодіоди)</text>
<text x="930" y="136" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GPIO = HIGH (3.3 В) → струм через R і LED на GND.</text>
<text x="930" y="158" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">I ≈ (3.3 − 2.0) / 220 ≈ 6 мА — безпечно</text>
<text x="930" y="180" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">для світлодіода і для виводу (межа ~20 мА).</text>
<text x="930" y="202" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Довга ніжка LED (+) — до резистора,</text>
<text x="930" y="224" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">коротка (−) — на GND.</text>
<text x="930" y="268" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Входи (кнопки), активний рівень LOW</text>
<text x="930" y="294" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Відпущена: підтяжка тримає вхід у 3.3 В → HIGH.</text>
<text x="930" y="316" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Натиснута: вхід замкнено на GND → LOW.</text>
<text x="930" y="338" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">S1: підтяжка всередині чипа (INPUT_PULLUP),</text>
<text x="930" y="360" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">     тому зовні лише кнопка між GPIO21 і GND.</text>
<text x="930" y="382" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">BOOT: підтяжка 10 kΩ уже на платі → INPUT.</text>
<text x="930" y="426" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Режими</text>
<text x="930" y="452" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">S1   → режим 1: D1+D2 разом, 200 мс</text>
<text x="930" y="474" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">BOOT → режим 2: D1/D2 по черзі, 1000 мс</text>
<text x="930" y="496" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Режим тримається до натискання іншої кнопки.</text>
<text x="930" y="544" font-size="14" text-anchor="start" font-weight="bold" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">Гребінці плати:</text>
<text x="930" y="566" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">лівий: GPIO15/16 — піни 8/9, G — пін 22;</text>
<text x="930" y="588" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">правий: GPIO21 — пін 18 (5-й від USB-C).</text>
<text x="930" y="610" font-size="14" text-anchor="start" font-weight="normal" fill="#b71c1c" font-family="DejaVu Sans, Arial, sans-serif">Не тримати BOOT під час скидання/увімкнення —</text>
<text x="930" y="632" font-size="14" text-anchor="start" font-weight="normal" fill="#b71c1c" font-family="DejaVu Sans, Arial, sans-serif">плата перейде в режим прошивки.</text>
</svg>