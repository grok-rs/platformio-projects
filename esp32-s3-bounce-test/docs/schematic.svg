<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760">
<rect width="1320" height="760" fill="#ffffff"/>
<text x="40" y="48" font-size="21" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Принципова схема: кнопка S1 на GPIO21 і логічний аналізатор (тест брязкоту)</text>
<rect x="40" y="80" width="340" height="420" rx="14" fill="#eef2f7" stroke="#334" stroke-width="2.5"/>
<text x="60" y="116" font-size="20" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">ESP32-S3</text>
<text x="60" y="138" font-size="16" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">YD-ESP32-S3</text>
<rect x="374" y="274" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="394" y="270" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GPIO21</text>
<line x1="386" y1="280" x2="416" y2="280" stroke="#222" stroke-width="2" stroke-linecap="round"/>
