<rect x="374" y="414" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="394" y="410" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GPIO41</text>
<line x1="386" y1="420" x2="416" y2="420" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<rect x="374" y="454" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="394" y="450" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GND</text>
<line x1="386" y1="460" x2="416" y2="460" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<text x="70" y="385" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">OUTPUT: BOUNCE</text>
<text x="70" y="425" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">Serial1 TX: LABEL</text>
<rect x="52" y="150" width="316" height="200" rx="8" fill="none" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="342" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">усередині чипа: INPUT_PULLUP + ISR</text>
<line x1="278" y1="178" x2="302" y2="178" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="290" y="170" font-size="13" text-anchor="middle" font-weight="bold" fill="#b71c1c" font-family="DejaVu Sans, Arial, sans-serif">3V3</text>
<line x1="290" y1="178" x2="290" y2="190" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<rect x="279" y="190" width="22" height="60" fill="#fff6d5" stroke="#52606d" stroke-width="2"/>
<text x="308" y="225" font-size="14" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif"></text>
<text x="272" y="230" font-size="14" text-anchor="end" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">≈45 kΩ</text>
<line x1="290" y1="250" x2="290" y2="280" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="290" cy="280" r="4.5" fill="#222"/>
<line x1="100" y1="280" x2="374" y2="280" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="272" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">вхід GPIO21</text>
<text x="70" y="314" font-size="13" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans Mono, monospace">ISR: час кожного фронту</text>
<line x1="416" y1="280" x2="580" y2="280" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="580" y1="280" x2="594" y2="280" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="646" y1="280" x2="660" y2="280" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="594" cy="280" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
<circle cx="646" cy="280" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="594" y1="266" x2="646" y2="266" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="620" y1="266" x2="620" y2="250" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="612" y1="250" x2="628" y2="250" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="620" y="310" font-size="15" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">S1  кнопка</text>
<line x1="660" y1="280" x2="820" y2="280" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="820" cy="280" r="4.5" fill="#222"/>
<line x1="820" y1="280" x2="820" y2="460" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="416" y1="460" x2="820" y2="460" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="820" cy="460" r="4.5" fill="#222"/>
<line x1="820" y1="510" x2="820" y2="522" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="804" y1="522" x2="836" y2="522" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="810" y1="528" x2="830" y2="528" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="816" y1="534" x2="824" y2="534" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="820" y1="460" x2="820" y2="510" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<text x="806" y="340" font-size="15" text-anchor="end" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GND</text>
<rect x="940" y="110" width="330" height="400" rx="14" fill="#eceff1" stroke="#263238" stroke-width="2.5"/>
<text x="964" y="210" font-size="19" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Логічний аналізатор</text>
<text x="964" y="232" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">24 MHz, 8 каналів</text>
<text x="964" y="260" font-size="14" text-anchor="start" font-weight="bold" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">USB → ПК, Logic 2 / PulseView</text>
<text x="964" y="282" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">входи 0…5 В, 3.3 В — OK</text>
<rect x="934" y="144" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="956" y="155" font-size="15" text-anchor="start" font-weight="bold" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">CH1</text>
<text x="1010" y="155" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">D0 — кнопка</text>
<rect x="934" y="374" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="956" y="385" font-size="15" text-anchor="start" font-weight="bold" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">CH2</text>
<text x="1010" y="385" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">D1 — BOUNCE</text>
<rect x="934" y="414" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="956" y="425" font-size="15" text-anchor="start" font-weight="bold" fill="#ef6c00" font-family="DejaVu Sans, Arial, sans-serif">CH3</text>
<text x="1010" y="425" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">D2 — LABEL (UART)</text>
<rect x="934" y="454" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="956" y="465" font-size="15" text-anchor="start" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">GND</text>
<circle cx="450" cy="280" r="4.5" fill="#1565c0"/>
<polyline points="450,280 450,150 934,150" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="820" y1="460" x2="934" y2="460" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="416" y1="380" x2="934" y2="380" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
<line x1="416" y1="420" x2="934" y2="420" stroke="#ef6c00" stroke-width="2.5" stroke-linecap="round"/>
<text x="442" y="142" font-size="13" text-anchor="start" font-weight="bold" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">щуп CH1</text>
<text x="40" y="580" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Кнопка, активний рівень LOW</text>
<text x="40" y="606" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Відпущена: підтяжка ≈45 kΩ тримає GPIO21 у 3.3 В → HIGH.</text>
<text x="40" y="628" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Натиснута: GPIO21 замкнено на GND → LOW.</text>
<text x="40" y="650" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Контакти при замиканні/розмиканні кілька мс «відскакують» —</text>
<text x="40" y="672" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">на вході серія LOW/HIGH замість одного фронту.</text>
<text x="680" y="580" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Два «свідки» одного сигналу</text>
<text x="680" y="606" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">ESP32: переривання CHANGE рахує фронти й міряє інтервали (Serial).</text>
<text x="680" y="628" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Аналізатор: CH1 бачить той самий провід із роздільністю 42 нс.</text>
<text x="680" y="650" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Імпульси, коротші за реакцію ISR (кілька мкс), ESP32 може пропустити.</text>
<text x="680" y="694" font-size="14" text-anchor="start" font-weight="bold" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">Logic 2: 24 MS/s, тригер на Channel 1 ↑ (BOUNCE) — лише брязкіт.</text>
<text x="680" y="716" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">Async Serial на Channel 2, 115200 → текстові підписи подій.</text>
</svg>