; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; Брязкіт кнопки: GPIO21 ── кнопка ── GND, логічний аналізатор на тому ж проводі.
;   pio run -e lab      -t upload && pio device monitor   ; звіт на кожну подію + мітки для аналізатора
;   pio run -e homework -t upload && pio device monitor   ; код з умови ДЗ 1.5 (FALLING), пін 16 → 21

[platformio]
default_envs = lab

[env]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

[env:lab]
build_src_filter = +<main.cpp>

[env:homework]
build_src_filter = +<homework.cpp>
