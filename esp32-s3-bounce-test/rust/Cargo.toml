[package]
name        = "bounce-test"
description = "Брязкіт кнопки на GPIO21: переривання на обидва фронти проти логічного аналізатора"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
default-run = "lab"

# cargo run --release                 — звіт на кожну подію + мітки BOUNCE/LABEL
[[bin]]
name  = "lab"
path  = "src/bin/lab.rs"
test  = false
bench = false

# cargo run --release --bin homework  — код з умови ДЗ 1.5 (FALLING), пін 21
[[bin]]
name  = "homework"
path  = "src/bin/homework.rs"
test  = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal.workspace                = true
esp-bootloader-esp-idf.workspace = true
esp-backtrace.workspace          = true
esp-println.workspace            = true
critical-section.workspace       = true
