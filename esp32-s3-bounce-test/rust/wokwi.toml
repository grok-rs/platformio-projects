# Wokwi simulation of the Rust firmware (bin `lab`).
# Build first with `cargo build --release`, then F1 -> "Wokwi: Start Simulator" in this folder,
# or from the project folder: wokwi-cli rust --timeout 20000
# For the homework code: `cargo build --release --bin homework` and change `lab` to `homework` below.
[wokwi]
version  = 1
firmware = '../../target/xtensa-esp32s3-none-elf/release/lab'
elf      = '../../target/xtensa-esp32s3-none-elf/release/lab'
