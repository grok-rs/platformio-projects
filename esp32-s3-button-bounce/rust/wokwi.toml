# Wokwi simulation of the Rust firmware (bin `bounce-lab`).
# Build first with `cargo build --release`, then F1 -> "Wokwi: Start Simulator" in this folder,
# or from the project folder: wokwi-cli rust --scenario ../wokwi/scenarios/ten-presses.yaml --timeout 40000
# For the original homework code: `cargo build --release --bin homework-base` and change both paths below.
[wokwi]
version  = 1
firmware = '../../target/xtensa-esp32s3-none-elf/release/bounce-lab'
elf      = '../../target/xtensa-esp32s3-none-elf/release/bounce-lab'
