[package]
name        = "button-bounce"
description = "Модуль 1.5: брязкіт кнопки на GPIO16 — кожен фронт із часом, рядок на подію, підсумок"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
default-run = "bounce-lab"

# cargo run --release                      — лабораторна прошивка (CHANGE, рядок на подію)
[[bin]]
name  = "bounce-lab"
path  = "src/bin/bounce-lab.rs"
test  = false
bench = false

# cargo run --release --bin homework-base  — код з умови завдання (FALLING-лічильник)
[[bin]]
name  = "homework-base"
path  = "src/bin/homework-base.rs"
test  = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal.workspace                = true
esp-bootloader-esp-idf.workspace = true
esp-backtrace.workspace          = true
esp-println.workspace            = true
critical-section.workspace       = true
