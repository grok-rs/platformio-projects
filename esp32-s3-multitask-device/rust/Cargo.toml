[package]
name        = "multitask-device"
description = "Фінальний проєкт «Мультизадачний пристрій»: три LED у своїх ритмах, BTN1 — швидкість, BTN2 — пауза, без delay"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true

# cargo run --release
[[bin]]
name  = "multitask-device"
path  = "src/main.rs"
test  = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal.workspace                = true
esp-bootloader-esp-idf.workspace = true
esp-backtrace.workspace          = true
esp-println.workspace            = true
