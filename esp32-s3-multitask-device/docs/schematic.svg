<text x="40" y="610" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Анод LED (довга ніжка) — до резистора, катод — до GND. Кнопки — між 3V3 і входом, режим INPUT_PULLDOWN:</text>
<text x="40" y="634" font-size="15" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">відпущена = LOW (внутрішня підтяжка ≈45 кОм до GND), натиснута = HIGH. Зовнішній резистор не потрібен.</text>
<text x="40" y="662" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">Немає другої кнопки? Вбудована BOOT (GPIO0): натиснута = LOW, режим INPUT.</text>
