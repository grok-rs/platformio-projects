<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640">
<rect width="1320" height="640" fill="#ffffff"/>
<text x="40.0" y="42.0" font-size="20" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Хто що робить: цикл живе в таймері gptimer, а не в app_main()</text>
