<text x="686.0" y="270.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">автоперезавантаження: лічильник з нуля</text>
<rect x="950.0" y="138.0" width="200.0" height="84.0" rx="8" fill="#fff4e5" stroke="#e65100" stroke-width="2"/>
<text x="1050.0" y="172.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">Переривання</text>
<text x="1050.0" y="198.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">ядро 0</text>
<line x1="910.0" y1="180.0" x2="950.0" y2="180.0" stroke="#e65100" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="950.0,180.0 940.0,184.5 940.0,175.5" fill="#e65100"/>
<rect x="440.0" y="320.0" width="500.0" height="170.0" rx="14" fill="#fff4e5" stroke="#e65100" stroke-width="2.5"/>
<text x="458.0" y="348.0" font-size="14" text-anchor="start" font-weight="bold" fill="#e65100" font-family="DejaVu Sans, Arial, sans-serif">on_tick(): обробник gptimer, весь цикл вентилятора</text>
<text x="462.0" y="382.0" font-size="14" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans Mono, monospace">ticks++;</text>
<text x="462.0" y="407.0" font-size="14" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans Mono, monospace">if (++second >= PERIOD_S) second = 0;</text>
<text x="462.0" y="432.0" font-size="14" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans Mono, monospace">bool on = second &lt; ON_S;</text>
<text x="462.0" y="457.0" font-size="14" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans Mono, monospace">gpio_set_level(FAN, on);  // і два LED</text>
<polyline points="1050.0,222.0 1050.0,300.0 880.0,300.0" fill="none" stroke="#e65100" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="880.0" y1="300.0" x2="880.0" y2="320.0" stroke="#e65100" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="880.0,320.0 875.5,310.0 884.5,310.0" fill="#e65100"/>
<rect x="1020.0" y="320.0" width="260.0" height="170.0" rx="14" fill="#fde8e8" stroke="#c62828" stroke-width="2.5"/>
<text x="1036.0" y="348.0" font-size="14" text-anchor="start" font-weight="bold" fill="#c62828" font-family="DejaVu Sans, Arial, sans-serif">Виходи</text>
<text x="1036.0" y="382.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">GPIO2 → BC547B → реле → мотор</text>
<text x="1036.0" y="408.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">GPIO15: червоний LED</text>
<text x="1036.0" y="434.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">GPIO16: зелений LED</text>
<line x1="940.0" y1="405.0" x2="1020.0" y2="405.0" stroke="#c62828" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="1020.0,405.0 1010.0,409.5 1010.0,400.5" fill="#c62828"/>
<rect x="40.0" y="320.0" width="330.0" height="170.0" rx="14" fill="#f3e8ff" stroke="#6a1b9a" stroke-width="2.5"/>
<text x="58.0" y="348.0" font-size="14" text-anchor="start" font-weight="bold" fill="#6a1b9a" font-family="DejaVu Sans, Arial, sans-serif">on_button(): кнопка S1, GPIO21</text>
<text x="58.0" y="384.0" font-size="14" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans Mono, monospace">if (second >= ON_S)</text>
<text x="58.0" y="409.0" font-size="14" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans Mono, monospace">  second = PERIOD_S - 1;</text>
<text x="58.0" y="458.0" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">наступний тік почне цикл спочатку</text>
<line x1="370.0" y1="405.0" x2="440.0" y2="405.0" stroke="#6a1b9a" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="440.0,405.0 430.0,409.5 430.0,400.5" fill="#6a1b9a"/>
<text x="404.0" y="396.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#6a1b9a" font-family="DejaVu Sans, Arial, sans-serif">second</text>
<rect x="40.0" y="522.0" width="1240.0" height="88.0" rx="14" fill="#f1f5f4" stroke="#00796b" stroke-width="2.5"/>
<text x="58.0" y="550.0" font-size="14" text-anchor="start" font-weight="bold" fill="#00796b" font-family="DejaVu Sans, Arial, sans-serif">while (1) в app_main(): необов'язковий спостерігач, циклу не потрібен</text>
<text x="58.0" y="578.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">друкує кожне перемикання і годує сторожа, лише якщо ticks змінився</text>
<text x="1262.0" y="578.0" font-size="13" text-anchor="end" font-weight="bold" fill="#00796b" font-family="DejaVu Sans, Arial, sans-serif">порожній цикл не зупинить вентилятор</text>
<line x1="690.0" y1="522.0" x2="690.0" y2="494.0" stroke="#00796b" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="690.0,494.0 694.5,504.0 685.5,504.0" fill="#00796b"/>
<text x="702.0" y="512.0" font-size="12" text-anchor="start" font-weight="normal" fill="#00796b" font-family="DejaVu Sans, Arial, sans-serif">читає ticks, second</text>
</svg>