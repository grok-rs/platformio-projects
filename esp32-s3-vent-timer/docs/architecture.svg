<text x="58.0" y="108.0" font-size="14" text-anchor="start" font-weight="bold" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">ЗАЛІЗО: працює саме, хоч би чим був зайнятий код</text>
