<text x="555.0" y="198.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#52606d" font-family="DejaVu Sans Mono, monospace">+1 кожну мкс</text>
<line x1="660.0" y1="180.0" x2="700.0" y2="180.0" stroke="#1565c0" stroke-width="2.2" stroke-linecap="round"/>
