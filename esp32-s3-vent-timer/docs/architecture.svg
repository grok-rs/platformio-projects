<text x="805.0" y="172.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">Будильник</text>
<text x="805.0" y="198.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#52606d" font-family="DejaVu Sans Mono, monospace">1 000 000 / SPEEDUP</text>
