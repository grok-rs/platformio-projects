<text x="40" y="724" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">gptimer (ESP-IDF): тік 1 мкс, спрацьовує раз на секунду циклу. Обробник сам рахує секунду циклу й перемикає GPIO2, GPIO15, GPIO16:</text>
<text x="40" y="746" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">другий цикл, loop() чи окрема задача для цього не потрібні. Під час налагодження SPEEDUP 300 робить з години 12 с, а з 15 хвилин 3 с.</text>
<text x="40" y="774" font-size="14" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">Мотор не можна вішати на GPIO напряму. Живлення мотора — від MB-102, а не від плати, GND спільний. Діод VD1 — смугою до «+», паралельно мотору.</text>
<text x="40" y="798" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">Мотора немає? Замість нього підійде LED + 220 Ом на контакті NO, як у «Сутінковому перемикачі».</text>
