; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; Модуль 2.5, ДЗ «Таймери»: витяжний вентилятор щогодини вмикається на 15 хвилин. ESP-IDF.
; GPIO2 → 10 кОм → BC547B → IN модуля реле (або мотор через ключ), LED на GPIO15 і GPIO16, кнопка GPIO21 → GND.
;   pio run -t upload && pio device monitor

[env:esp32-s3]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode  = qio
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0
