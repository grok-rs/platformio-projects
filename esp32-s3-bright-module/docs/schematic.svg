<text x="1166" y="766" font-size="15" text-anchor="middle" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">E</text>
<line x1="1190" y1="706" x2="1190" y2="748" stroke="#9e9e9e" stroke-width="3" stroke-linecap="round"/>
<text x="1190" y="766" font-size="15" text-anchor="middle" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">B</text>
<line x1="1214" y1="706" x2="1214" y2="748" stroke="#9e9e9e" stroke-width="3" stroke-linecap="round"/>
<text x="1214" y="766" font-size="15" text-anchor="middle" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">C</text>
<text x="1190" y="784" font-size="12" text-anchor="middle" font-weight="normal" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">звірте з даташитом</text>
</svg>