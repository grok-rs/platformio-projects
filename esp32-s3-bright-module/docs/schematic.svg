<polygon points="455.0,376.0 443.9,380.7 443.9,371.3" fill="#1565c0"/>
<text x="395" y="400" font-size="14" text-anchor="start" font-weight="bold" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">I<tspan font-size="11" dy="4">B</tspan><tspan dy="-4"> ≈ (3,3 − 0,7) / 1000 ≈ 2,6 мА</tspan></text>
<text x="692" y="336" font-size="14" text-anchor="end" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">B</text>
<text x="752" y="318" font-size="14" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">C</text>
<text x="752" y="392" font-size="14" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">E</text>
<text x="688" y="380" font-size="12" text-anchor="end" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">≈0,7 В</text>
<text x="776" y="344" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Q1  2N2222</text>
<text x="776" y="366" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">NPN, ключ «на землі»</text>
<text x="776" y="386" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">увімкнено: U<tspan font-size="11" dy="4">CE</tspan><tspan dy="-4"> ≈ 0,1 В</tspan></text>
<line x1="740" y1="130" x2="740" y2="148" stroke="#222" stroke-width="2" stroke-linecap="round"/>
