<text x="272" y="286" font-size="15" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif"></text>
<text x="234" y="276" font-size="12" text-anchor="end" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">≈45 кОм</text>
