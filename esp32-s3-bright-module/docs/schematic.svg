<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
<rect width="1320" height="860" fill="#ffffff"/>
<text x="40" y="46" font-size="20" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">ТЗ-A «Яскравий модуль»: ESP32-S3 керує яскравістю LED через ключ 2N2222, кнопка S1 перемикає рівні</text>
<rect x="40" y="90" width="300" height="470" rx="14" fill="#eef2f7" stroke="#334" stroke-width="2.5"/>
<text x="60" y="126" font-size="20" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">ESP32-S3</text>
<text x="60" y="148" font-size="15" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">YD-ESP32-S3 / DevKitC-1</text>
<text x="60" y="182" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">живлення: USB-C від ПК</text>
<text x="60" y="204" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">логіка 3,3 В</text>
<text x="54" y="394" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">ledcSetup(0, 5000, 8);</text>
<text x="54" y="412" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">ledcAttachPin(5, 0);</text>
<text x="54" y="430" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">ledcWrite(0, duty);</text>
<text x="54" y="448" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">pinMode(6, INPUT_PULLDOWN);</text>
<text x="54" y="466" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">attachInterrupt(6, onPress, RISING);</text>
<text x="54" y="488" font-size="12" text-anchor="start" font-weight="bold" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">duty: 0 → 40 → 128 → 255 → 0</text>
<rect x="334" y="164" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="328" y="175" font-size="15" text-anchor="end" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">3V3</text>
