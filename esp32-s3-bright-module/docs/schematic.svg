<text x="764" y="160" font-size="15" text-anchor="start" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">HL1  LED</text>
<text x="764" y="180" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">червоний</text>
<text x="730" y="144" font-size="14" text-anchor="end" font-weight="bold" fill="#b71c1c" font-family="DejaVu Sans, Arial, sans-serif">+</text>
<text x="730" y="196" font-size="14" text-anchor="end" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">−</text>
<line x1="740" y1="110" x2="740" y2="130" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<line x1="740" y1="200" x2="740" y2="222" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<rect x="729" y="222" width="22" height="60" fill="#fff6d5" stroke="#222" stroke-width="2"/>
<text x="762" y="248" font-size="15" text-anchor="start" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">R2</text>
<text x="762" y="268" font-size="15" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">220 Ом</text>
<line x1="740" y1="282" x2="740" y2="310" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="850" y1="150" x2="850" y2="270" stroke="#e65100" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="850.0,270.0 845.3,258.9 854.7,258.9" fill="#e65100"/>
<text x="864" y="180" font-size="14" text-anchor="start" font-weight="bold" fill="#e65100" font-family="DejaVu Sans, Arial, sans-serif">I<tspan font-size="11" dy="4">C</tspan><tspan dy="-4"> ≈ (5 − 2,0 − 0,1) / 220</tspan></text>
<text x="864" y="202" font-size="14" text-anchor="start" font-weight="bold" fill="#e65100" font-family="DejaVu Sans, Arial, sans-serif">≈ 13 мА</text>
<text x="864" y="228" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">іде від MB-102,</text>
<text x="864" y="246" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">а не з піна ESP32</text>
<rect x="1080" y="90" width="210" height="470" rx="14" fill="#fff4f2" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="1104" y="240" font-size="20" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">MB-102</text>
<text x="1104" y="262" font-size="15" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">модуль живлення</text>
<text x="1104" y="296" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">перемичка цієї</text>
<text x="1104" y="316" font-size="14" text-anchor="start" font-weight="bold" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">сторони: 5V</text>
<text x="1104" y="350" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">вхід: USB 5 В або</text>
<text x="1104" y="370" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">DC-гніздо 6,5–12 В</text>
<text x="1104" y="404" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">кнопка живлення: ON</text>
<rect x="1074" y="104" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="1094" y="115" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">+5 В</text>
<line x1="1074" y1="110" x2="1044" y2="110" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<rect x="1074" y="514" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="1094" y="525" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GND (−)</text>
<line x1="1074" y1="520" x2="1044" y2="520" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="740" y1="110" x2="1044" y2="110" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<text x="760" y="100" font-size="14" text-anchor="start" font-weight="bold" fill="#c62828" font-family="DejaVu Sans, Arial, sans-serif">+5 В (шина «+» макетки)</text>
<line x1="740" y1="390" x2="740" y2="520" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="376" y1="520" x2="1044" y2="520" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/>
<circle cx="740" cy="520" r="4.5" fill="#2e7d32"/>
<circle cx="416" cy="520" r="4.5" fill="#2e7d32"/>
<line x1="416" y1="520" x2="416" y2="534" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="398" y1="534" x2="434" y2="534" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="405" y1="540" x2="427" y2="540" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="412" y1="546" x2="420" y2="546" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="470" y="508" font-size="15" text-anchor="start" font-weight="bold" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">СПІЛЬНА ЗЕМЛЯ: GND ESP32 = «−» MB-102</text>
<text x="470" y="560" font-size="13" text-anchor="start" font-weight="normal" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">без цього дроту струм бази не має шляху назад → LED не світить</text>
<text x="752" y="460" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">емітер → GND</text>
<text x="40" y="620" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Як це працює</text>
<text x="40" y="646" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">1.  GPIO5 видає ШІМ 5 кГц (LEDC, 8 біт). У фазі HIGH через R1 тече ≈ 2,6 мА → Q1 у насиченні; у фазі LOW Q1 закритий.</text>
<text x="40" y="668" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">2.  Струм LED ≈ 13 мА іде імпульсами: +5 В → LED → R2 → C → E → GND → MB-102. Яскравість ∝ duty / 255:</text>
<text x="70" y="690" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">OFF = 0 (0 %),  LOW = 40 (≈16 %),  MID = 128 (≈50 %),  HIGH = 255 (100 %, U<tspan font-size="11" dy="4">CE</tspan><tspan dy="-4"> ≈ 0,1–0,2 В).</tspan></text>
<text x="40" y="712" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">3.  S1: відпущена — внутрішня підтяжка тримає GPIO6 у LOW; натиснута — 3,3 В → RISING → ISR ставить прапорець, рівень змінює loop().</text>
<text x="40" y="734" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">4.  Запас: I<tspan font-size="11" dy="4">C</tspan><tspan dy="-4"></tspan> / I<tspan font-size="11" dy="4">B</tspan><tspan dy="-4"> ≈ 13 / 2,6 ≈ 5 — значно менше h</tspan><tspan font-size="11" dy="4">FE</tspan><tspan dy="-4"> 2N2222A (≥ 75 при 10 мА), тож ключ надійно в насиченні.</tspan></text>
<text x="40" y="770" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Перевірка перед увімкненням (схему перемикати лише при вимкненому живленні)</text>
<text x="40" y="794" font-size="14" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">• «−» MB-102 з'єднано з GND ESP32 — єдиний зв'язок між живленнями.   • +5 В MB-102 НЕ йде на 5V / VIN / піни ESP32.</text>
<text x="40" y="816" font-size="14" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">• Кнопка — від 3V3.   • Довга ніжка LED (анод) — до +5 В.   • E-B-C визначено за вашим корпусом.</text>
<text x="1100" y="604" font-size="14" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">2N2222 / PN2222A, TO-92</text>
<path d="M1150,706 L1150,666 A40,40 0 0 1 1230,666 L1230,706 Z" fill="#333" stroke="#000" stroke-width="1.5"/>
<text x="1190" y="692" font-size="11" text-anchor="middle" font-weight="normal" fill="#ddd" font-family="DejaVu Sans, Arial, sans-serif">плаский бік</text>
