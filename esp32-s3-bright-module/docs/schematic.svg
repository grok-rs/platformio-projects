<polyline points="440,250 440,240 376,240" fill="none" stroke="#6a1b9a" stroke-width="2.5" stroke-linejoin="round"/>
<text x="480" y="228" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">натиснута → GPIO6 = 3,3 В</text>
<text x="480" y="246" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">→ фронт RISING → ISR</text>
<text x="480" y="268" font-size="13" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">тільки від 3V3, ніколи від 5 В!</text>
