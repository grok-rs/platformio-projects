<text x="510" y="330" font-size="15" text-anchor="middle" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">R1  1 кОм</text>
<line x1="550" y1="350" x2="700" y2="350" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
