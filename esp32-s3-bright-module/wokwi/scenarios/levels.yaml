# Автотест ТЗ-A, етап 4 (прошивки levels і softpwm): ВП-3…ВП-7.
# --elf — шлях відносно поточної теки (проєкту), а не теки cpp/ чи rust/.
#   C++:  (cd cpp && pio run -e levels_wokwi) && wokwi-cli cpp --scenario ../wokwi/scenarios/levels.yaml --timeout 30000
#   Рівень «+»: (cd cpp && pio run -e softpwm_wokwi) && wokwi-cli cpp --elf cpp/.pio/build/softpwm_wokwi/firmware.elf --scenario ../wokwi/scenarios/levels.yaml --timeout 30000
#   Rust: cargo build --release --features wokwi && wokwi-cli rust --scenario ../wokwi/scenarios/levels.yaml --timeout 30000
# *_wokwi / --features wokwi: кнопка на GPIO7 замість GPIO6 — Wokwi тримає GPIO6 ESP32-S3 у HIGH (див. README).
# Рівень виводу перевіряється лише на OFF (0 %) і HIGH (100 %): на LOW/MID там ШІМ, і
# expect-pin влучив би у випадкову фазу періоду. Їх перевіряє рядок у Serial.
name: 'Levels: OFF -> LOW -> MID -> HIGH -> OFF'
version: 1
author: 'grok-rs'

steps:
  - wait-serial: 'Level: OFF (duty 0, 0%)'
  - delay: 200ms
  - expect-pin: { part-id: esp, pin: '5', value: 0 }

  # --- ВП-6: чотири натискання — повне коло ------------------------------------------
  - set-control: { part-id: btnS1, control: pressed, value: 1 }
  - wait-serial: 'Press #1 -> LOW (duty 40, 16%)'
  - set-control: { part-id: btnS1, control: pressed, value: 0 }
  - delay: 300ms

  - set-control: { part-id: btnS1, control: pressed, value: 1 }
  - wait-serial: 'Press #2 -> MID (duty 128, 50%)'
  - set-control: { part-id: btnS1, control: pressed, value: 0 }
  - delay: 300ms

  - set-control: { part-id: btnS1, control: pressed, value: 1 }
  - wait-serial: 'Press #3 -> HIGH (duty 255, 100%)'
  - set-control: { part-id: btnS1, control: pressed, value: 0 }
  - delay: 300ms
  # 255 — це 100 %: вихід постійно HIGH, LED світить на повну.
  - expect-pin: { part-id: esp, pin: '5', value: 1 }
  - delay: 7ms
  - expect-pin: { part-id: esp, pin: '5', value: 1 }
  - expect-pin: { part-id: led1, pin: 'A', value: 1 }

  - set-control: { part-id: btnS1, control: pressed, value: 1 }
  - wait-serial: 'Press #4 -> OFF (duty 0, 0%)'
  - set-control: { part-id: btnS1, control: pressed, value: 0 }
  - delay: 300ms
  - expect-pin: { part-id: esp, pin: '5', value: 0 }
  - delay: 7ms
  - expect-pin: { part-id: esp, pin: '5', value: 0 }

  # --- ВП-5: довге утримання й брязкіт відпускання — це один перехід, а не кілька --------
  - set-control: { part-id: btnS1, control: pressed, value: 1 }
  - wait-serial: 'Press #5 -> LOW (duty 40, 16%)'
  - delay: 1500ms
  - set-control: { part-id: btnS1, control: pressed, value: 0 }
  - delay: 500ms
  # Якби утримання чи відпускання рахувалося, тут був би #7 або MID.
  - set-control: { part-id: btnS1, control: pressed, value: 1 }
  - wait-serial: 'Press #6 -> MID (duty 128, 50%)'
  - set-control: { part-id: btnS1, control: pressed, value: 0 }
