[package]
name        = "bright-module"
description = "ТЗ-A «Яскравий модуль»: ключ 2N2222, ШІМ LEDC на GPIO5, кнопка GPIO6 з чотирма рівнями"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
default-run = "levels"

# Один бінарник на етап ТЗ (як env у platformio.ini):
#   cargo run --release                  (levels: етап 4)
#   cargo run --release --bin switch     (етап 2)
#   cargo run --release --bin sweep      (етап 3)
#   cargo run --release --bin softpwm    (рівень «+»)
[[bin]]
name  = "levels"
path  = "src/bin/levels.rs"
test  = false
bench = false

[[bin]]
name  = "switch"
path  = "src/bin/switch.rs"
test  = false
bench = false

[[bin]]
name  = "sweep"
path  = "src/bin/sweep.rs"
test  = false
bench = false

[[bin]]
name  = "softpwm"
path  = "src/bin/softpwm.rs"
test  = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal.workspace                = true
esp-bootloader-esp-idf.workspace = true
esp-backtrace.workspace          = true
esp-println.workspace            = true
critical-section.workspace       = true  # кнопка: вхід спільний з обробником переривання
embedded-hal.workspace           = true  # SetDutyCycle для каналу LEDC
