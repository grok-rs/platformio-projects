; PlatformIO Project Configuration
; Board: YD-ESP32-S3 (VCC-GND Studio, ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; ТЗ-A «Яскравий модуль»: GPIO5 → 1 кОм → база 2N2222, LED з живленням 5 В від MB-102 у колекторі;
; кнопка 3V3 → GPIO6 (INPUT_PULLDOWN). Одна прошивка на кожен етап ТЗ:
;
;   pio run -e levels  -t upload   ; етап 4 / ВП-1…ВП-8: кнопка, 4 рівні яскравості (за замовчуванням)
;   pio run -e switch  -t upload   ; етап 2: GPIO5 HIGH/LOW по 3 с — заміри U(БЕ)
;   pio run -e sweep   -t upload   ; етап 3: ШІМ 0 → 255 → 0 з паузами — заміри U(КЕ)
;   pio run -e softpwm -t upload   ; рівень «+»: програмний ШІМ на millis() замість LEDC
;   pio test -e native             ; модульні тести логіки (lib/logic) на ПК, без плати
;   pio device monitor             ; Serial 115200 (ВП-7)

[platformio]
default_envs = levels

; Спільні налаштування прошивки. Не [env], бо тоді їх успадкувало б і середовище native.
[esp32]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- Memory: 16 MB QIO flash + 8 MB OPI PSRAM ---------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

board_build.partitions = default_16MB.csv
board_build.f_cpu   = 240000000L
board_build.f_flash = 80000000L

; Ядро Arduino 2.x за замовчуванням збирає з -std=gnu++11. Потрібно щонайменше C++14 (constexpr-
; функції зі switch) і C++17 (неявно inline `static constexpr` члени, static_assert без повідомлення).
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; Native USB CDC configuration
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
; Попередження — лише для нашого коду (src/), не для ядра Arduino.
build_src_flags = -Wall -Wextra

; --- Upload / monitor ---------------------------------------------------
monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0
monitor_filters =
  esp32_exception_decoder
  time

[env:levels]
extends = esp32
build_src_filter = +<levels.cpp>

[env:switch]
extends = esp32
build_src_filter = +<switch.cpp>

[env:sweep]
extends = esp32
build_src_filter = +<sweep.cpp>

[env:softpwm]
extends = esp32
build_src_filter = +<softpwm.cpp>

; Логіка з lib/logic не знає про Arduino, тому її тести збираються звичайним g++ на ПК.
[env:native]
platform       = native
test_framework = unity
build_flags    = -std=c++17 -Wall -Wextra -Werror
