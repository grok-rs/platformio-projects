; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; ТЗ-A «Яскравий модуль»: GPIO5 → 1 кОм → база 2N2222, LED від MB-102 (+5 В) у колекторі;
; кнопка 3V3 → GPIO6. Одна прошивка на етап ТЗ:
;   pio run -e levels  -t upload && pio device monitor   ; етап 4: кнопка + 4 рівні (за замовчуванням)
;   pio run -e switch  -t upload && pio device monitor   ; етап 2: GPIO5 HIGH/LOW по 3 с
;   pio run -e sweep   -t upload && pio device monitor   ; етап 3: ШІМ 0 → 255 → 0
;   pio run -e softpwm -t upload && pio device monitor   ; рівень «+»: програмний ШІМ на millis()

[platformio]
default_envs = levels

[env]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

[env:levels]
build_src_filter = +<levels.cpp>

[env:switch]
build_src_filter = +<switch.cpp>

[env:sweep]
build_src_filter = +<sweep.cpp>

[env:softpwm]
build_src_filter = +<softpwm.cpp>
