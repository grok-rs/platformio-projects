; Урок 2.1 · міні-лаба «Фрагментація купи». Плата YD-ESP32-S3 N16R8 (16 МБ Flash QIO, 8 МБ PSRAM OPI).
; Покладіть цей файл у порожню теку, скетч — у src/main.cpp, і виконайте: pio run -t upload, потім pio device monitor

[env:heaplab]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
monitor_speed = 115200
