# Спільні налаштування збирання для всіх Rust-прошивок робочого простору (Cargo шукає цей файл
# угору від поточної теки, тож він діє і в `esp32-s3-*/rust`).

[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# `cargo run` = зібрати, прошити через USB і відкрити монітор (як `pio run -t upload && pio device monitor`).
runner = "espflash flash --monitor --chip esp32s3"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  # Скрипт компонувальника esp-hal (секції IRAM/DRAM/flash, вектори переривань); має бути останнім.
  "-C", "link-arg=-Tlinkall.x",
  # IRAM на ESP32 водночас і код, і дані — сегмент RWX тут нормальний, попередження ld зайве.
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
]

[unstable]
# Для Xtensa немає готової `core` — вона збирається з вихідних кодів разом із проєктом.
# Стабільний cargo цю таблицю ігнорує, тому `cargo +stable host-test` працює.
build-std = ["core"]

[alias]
# Модульні тести «чистої» логіки (src/lib.rs кожного проєкту) на ПК, без плати:
#   cargo +stable host-test               — усі проєкти (з кореня репозиторію)
#   cargo +stable host-test -p led-blink  — один
host-test = "test --lib --target x86_64-unknown-linux-gnu"
