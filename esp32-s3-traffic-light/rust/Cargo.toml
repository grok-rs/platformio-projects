[package]
name         = "traffic-light"
description  = "Модуль 2, урок 28, міні-проєкт «Світлофор» за ПДР України. Rust на ESP-IDF"
version      = "0.1.0"
edition      = "2024"
publish      = false

# Окремий робочий простір: решта репозиторію — esp-hal без ОС, а тут std поверх ESP-IDF і FreeRTOS.
[workspace]

# cargo run --release
[[bin]]
name  = "traffic-light"
path  = "src/main.rs"
test  = false
bench = false

[dependencies]
# Обгортки ESP-IDF: hal (GPIO, затримки) і sys (сирі C-функції) реекспортуються звідси.
esp-idf-svc = "0.53"

[build-dependencies]
embuild = "0.33"  # знаходить зібраний ESP-IDF і передає його налаштування компілятору

[profile.release]
opt-level = "s"

[profile.dev]
debug     = true
opt-level = "z"
