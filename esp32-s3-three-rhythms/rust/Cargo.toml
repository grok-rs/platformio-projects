[package]
name        = "three-rhythms"
description = "Проєкт A «Три ритми»: три LED, три таймери, без delay"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true

# cargo run --release
[[bin]]
