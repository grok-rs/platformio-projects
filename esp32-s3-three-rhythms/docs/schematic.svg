<text x="40" y="560" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Анод LED (довга ніжка) — до резистора, катод (коротка, зріз на корпусі) — до GND.  HIGH на GPIO = світить.</text>
<text x="40" y="588" font-size="15" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Струм кожного LED ≈ (3,3 − U<tspan font-size="11" dy="4">LED</tspan><tspan dy="-4">) / 220 Ом: червоний/жовтий ≈ 5–6 мА, зелений 1,5–5 мА (залежить від типу)</tspan></text>
<text x="40" y="610" font-size="15" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">на пін, сумарно на пін, сумарно ≈ 18 мА: GPIOlt; 18 мА: GPIO ESP32-S3 це віддає без транзистора, зовнішнє живлення не потрібне.</text>
<text x="40" y="640" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">Піни в завданні — GPIO15/16/17; на стенді — GPIO6/5/4. Обидва варіанти вільні: не strapping (0, 3, 45, 46), не USB (19, 20),</text>
<text x="40" y="660" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">не флеш/PSRAM (26–37), не RGB-світлодіод (48).</text>
</svg>