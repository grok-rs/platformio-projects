<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900">
<rect width="1320" height="900" fill="#ffffff"/>
<text x="40" y="48" font-size="21" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Принципова схема: світлодіод, кнопка S1 і логічний аналізатор</text>
<rect x="40" y="80" width="340" height="560" rx="14" fill="#eef2f7" stroke="#334" stroke-width="2.5"/>
<text x="60" y="116" font-size="20" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">ESP32-S3</text>
<text x="60" y="138" font-size="16" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">YD-ESP32-S3</text>
<rect x="374" y="194" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="394" y="190" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GPIO15</text>
<line x1="386" y1="200" x2="416" y2="200" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<rect x="374" y="394" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="394" y="390" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GPIO21</text>
<line x1="386" y1="400" x2="416" y2="400" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<rect x="374" y="594" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="394" y="590" font-size="15" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GND</text>
<line x1="386" y1="600" x2="416" y2="600" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="205" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">OUTPUT</text>
<rect x="52" y="300" width="316" height="150" rx="8" fill="none" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="442" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">усередині чипа: INPUT_PULLUP</text>
<line x1="278" y1="318" x2="302" y2="318" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="290" y="310" font-size="13" text-anchor="middle" font-weight="bold" fill="#b71c1c" font-family="DejaVu Sans, Arial, sans-serif">3V3</text>
<line x1="290" y1="318" x2="290" y2="328" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<rect x="279" y="328" width="22" height="60" fill="#fff6d5" stroke="#52606d" stroke-width="2"/>
<text x="308" y="363" font-size="14" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif"></text>
<text x="272" y="368" font-size="14" text-anchor="end" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">≈45 kΩ</text>
<line x1="290" y1="388" x2="290" y2="400" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="290" cy="400" r="4.5" fill="#222"/>
<line x1="100" y1="400" x2="374" y2="400" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="392" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">вхід GPIO21</text>
<line x1="416" y1="200" x2="500" y2="200" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<rect x="500" y="189" width="80" height="22" fill="#fff6d5" stroke="#222" stroke-width="2"/>
<text x="540" y="182" font-size="15" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">R1  220 Ω</text>
<line x1="580" y1="200" x2="640" y2="200" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="640" y1="200" x2="650" y2="200" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<polygon points="650,184 650,216 682,200" fill="#e53935" stroke="#222" stroke-width="2"/>
<line x1="682" y1="184" x2="682" y2="216" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="682" y1="200" x2="700" y2="200" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="664" y1="180" x2="674" y2="168" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<line x1="674" y1="180" x2="684" y2="168" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<text x="670" y="236" font-size="15" text-anchor="middle" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">D1</text>
<line x1="700" y1="200" x2="820" y2="200" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="416" y1="400" x2="580" y2="400" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="580" y1="400" x2="594" y2="400" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="646" y1="400" x2="660" y2="400" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="594" cy="400" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
<circle cx="646" cy="400" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="594" y1="386" x2="646" y2="386" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="620" y1="386" x2="620" y2="370" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="612" y1="370" x2="628" y2="370" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="620" y="430" font-size="15" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">S1  кнопка</text>
<line x1="660" y1="400" x2="820" y2="400" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="820" cy="400" r="4.5" fill="#222"/>
<line x1="820" y1="200" x2="820" y2="600" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="416" y1="600" x2="820" y2="600" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="820" cy="600" r="4.5" fill="#222"/>
<line x1="820" y1="660" x2="820" y2="672" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="804" y1="672" x2="836" y2="672" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="810" y1="678" x2="830" y2="678" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="816" y1="684" x2="824" y2="684" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="820" y1="600" x2="820" y2="660" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<text x="806" y="500.0" font-size="15" text-anchor="end" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GND</text>
<rect x="940" y="110" width="330" height="560" rx="14" fill="#eceff1" stroke="#263238" stroke-width="2.5"/>
<text x="964" y="440" font-size="19" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Логічний аналізатор</text>
<text x="964" y="462" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">24 MHz, 8 каналів (fx2lafw)</text>
<text x="964" y="626" font-size="14" text-anchor="start" font-weight="bold" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">USB → ПК, PulseView</text>
<text x="964" y="648" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">входи 0…5 В, 3.3 В — OK</text>
<rect x="934" y="144" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="956" y="155" font-size="15" text-anchor="start" font-weight="bold" fill="#00897b" font-family="DejaVu Sans, Arial, sans-serif">CH1</text>
<text x="1010" y="155" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">D0 — LED</text>
<rect x="934" y="324" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="956" y="335" font-size="15" text-anchor="start" font-weight="bold" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">CH2</text>
<text x="1010" y="335" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">D1 — кнопка</text>
<rect x="934" y="594" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="956" y="605" font-size="15" text-anchor="start" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">GND</text>
<circle cx="450" cy="200" r="4.5" fill="#00897b"/>
<polyline points="450,200 450,150 934,150" fill="none" stroke="#00897b" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="470" cy="400" r="4.5" fill="#1565c0"/>
<polyline points="470,400 470,330 934,330" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="820" y1="600" x2="934" y2="600" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="442" y="142" font-size="13" text-anchor="start" font-weight="bold" fill="#00897b" font-family="DejaVu Sans, Arial, sans-serif">щуп CH1</text>
<text x="462" y="322" font-size="13" text-anchor="start" font-weight="bold" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">щуп CH2</text>
<text x="40" y="720" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Вихід (світлодіод)</text>
<text x="40" y="746" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GPIO15 = HIGH (3.3 В) → струм через R1 і D1 на GND.</text>
<text x="40" y="768" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">I ≈ (3.3 − 2.0) / 220 ≈ 6 мА — безпечно (межа виводу ~20 мА).</text>
<text x="40" y="790" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Довга ніжка LED (+) — до резистора, коротка (−) — на GND.</text>
<text x="40" y="834" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Вхід (кнопка), активний рівень LOW</text>
<text x="40" y="860" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Відпущена: підтяжка ≈45 kΩ тримає GPIO21 у 3.3 В → HIGH.</text>
<text x="40" y="882" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Натиснута: GPIO21 замкнено на GND → LOW.</text>
<text x="680" y="720" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Логічний аналізатор лише «слухає»</text>
<text x="680" y="746" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Входи аналізатора високоомні — на схему вони не впливають.</text>
<text x="680" y="768" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">CH1 бачить вихід GPIO15, CH2 — вхід GPIO21 разом із брязкотом.</text>
<text x="680" y="790" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GND аналізатора — обов'язково до GND плати: рівні вимірюються</text>
<text x="680" y="812" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">відносно землі, без неї запис — випадковий шум.</text>
<text x="680" y="856" font-size="14" text-anchor="start" font-weight="bold" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">PulseView: fx2lafw, 1–4 МГц, тригер на CH2 ↓ (falling).</text>
<text x="680" y="878" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">Між фронтом CH2 і фронтом CH1 — затримка антибрязкоту 30 мс.</text>
</svg>