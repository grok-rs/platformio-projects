; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; Світлодіод (GPIO15 + 220 Ω) і кнопка (GPIO21, INPUT_PULLUP).
;   pio run -e hold   -t upload && pio device monitor   ; крок 1: LED світить, поки кнопку тримають
;   pio run -e toggle -t upload && pio device monitor   ; крок 2: натискання перемикає LED

[platformio]
default_envs = toggle

[env]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

[env:hold]
build_src_filter = +<hold.cpp>

[env:toggle]
build_src_filter = +<toggle.cpp>
