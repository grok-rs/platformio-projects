# Автотест для wokwi-cli (прошивка toggle): кожне натискання перемикає LED.
#   C++:  (cd cpp && pio run -e toggle) && wokwi-cli cpp --scenario ../wokwi/scenarios/toggle.yaml --timeout 10000
#   Rust: cargo build --release && wokwi-cli rust --scenario ../wokwi/scenarios/toggle.yaml --timeout 10000
# Час у сценарії — симульований, тому перевірки рівнів на виводах детерміновані.
name: 'Toggle: press -> ON, press -> OFF'
version: 1
author: 'grok-rs'

steps:
  - wait-serial: 'debounce 30 ms'
  - expect-pin: { part-id: esp, pin: '15', value: 0 }

  # --- Натискання 1: LED вмикається й лишається увімкненим після відпускання ---
  - set-control: { part-id: btnS1, control: pressed, value: 1 }
  - wait-serial: 'Press #1 -> LED ON'
  - delay: 100ms
  - set-control: { part-id: btnS1, control: pressed, value: 0 }
  - delay: 100ms
  - expect-pin: { part-id: esp, pin: '15', value: 1 }
  # Анод LED отримує рівень виводу через перемичку й резистор на макетці.
  - expect-pin: { part-id: led1, pin: 'A', value: 1 }

  # --- Натискання 2: LED вимикається -----------------------------------------
  - set-control: { part-id: btnS1, control: pressed, value: 1 }
  - wait-serial: 'Press #2 -> LED OFF'
  - delay: 100ms
  - set-control: { part-id: btnS1, control: pressed, value: 0 }
  - delay: 100ms
  - expect-pin: { part-id: esp, pin: '15', value: 0 }
