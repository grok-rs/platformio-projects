; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; Модуль 3, урок 3.1, ДЗ: LDR, ковзне середнє (SMA) і два пороги. ESP-IDF, АЦП в режимі oneshot.
; LDR від 3V3 до GPIO4 (ADC1_CH3), 10 кОм від GPIO4 до GND; LED на GPIO15 через 220 Ом на GND.
;   pio run -t upload && pio device monitor

[env:esp32-s3]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode  = qio
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0
