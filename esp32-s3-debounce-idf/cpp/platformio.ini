; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; Модуль 2.6, ДЗ «Усунення брязкоту контактів»: завдання уроку 2.4 на ESP-IDF, по одній прошивці на завдання.
; Кнопка між GPIO7 і GND, підтяжка 10 кОм до 3V3, LED на GPIO15 через 220 Ом; RC-фільтр — лише в завданні 5.
;   pio run -e raw   -t upload && pio device monitor   ; завдання 1: лише переривання
;   pio run -e time  -t upload && pio device monitor   ; завдання 2: час перевіряє задача
;   pio run -e state -t upload && pio device monitor   ; завдання 3: задача перевіряє рівень
;   pio run -e poll  -t upload && pio device monitor   ; завдання 4: опитування + машина станів

[platformio]
default_envs = raw

[env]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode  = qio
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

[env:raw]
[env:time]
[env:state]
[env:poll]
