<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#ffffff"/>
<text x="40" y="46" font-size="19" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Усунення брязкоту: кнопка на GPIO7 з підтяжкою 10 кОм, LED на GPIO15, RC-фільтр лише в завданні 5</text>
<rect x="40" y="90" width="260" height="470" rx="14" fill="#eef2f7" stroke="#334" stroke-width="2.5"/>
<text x="60" y="126" font-size="22" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">ESP32-S3</text>
<text x="60" y="150" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">YD-ESP32-S3 (N16R8)</text>
<text x="60" y="184" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">ESP-IDF 6.1 (C) або</text>
<text x="60" y="204" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">esp-hal (Rust)</text>
<rect x="294" y="124" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="286" y="136" font-size="17" text-anchor="end" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">3V3</text>
<rect x="294" y="264" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="286" y="276" font-size="17" text-anchor="end" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GPIO7</text>
<rect x="294" y="414" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="286" y="426" font-size="17" text-anchor="end" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GPIO15</text>
<rect x="294" y="514" width="12" height="12" fill="#c9a227" stroke="#7a5f00" stroke-width="1.5"/>
<text x="286" y="526" font-size="17" text-anchor="end" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">GND</text>
<line x1="306" y1="130" x2="520" y2="130" stroke="#ef6c00" stroke-width="2.5" stroke-linecap="round"/>
<text x="340" y="120" font-size="14" text-anchor="start" font-weight="bold" fill="#ef6c00" font-family="DejaVu Sans, Arial, sans-serif">тільки 3V3, не 5V!</text>
<rect x="508" y="160" width="24" height="70" fill="#fff6d5" stroke="#222" stroke-width="2"/>
<text x="498" y="190" font-size="15" text-anchor="end" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">R1</text>
<text x="498" y="210" font-size="15" text-anchor="end" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">10 кОм</text>
<line x1="520" y1="130" x2="520" y2="160" stroke="#ef6c00" stroke-width="2.5" stroke-linecap="round"/>
<line x1="520" y1="230" x2="520" y2="270" stroke="#6a1b9a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="306" y1="270" x2="520" y2="270" stroke="#6a1b9a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="520" cy="270" r="5" fill="#6a1b9a"/>
<text x="330" y="258" font-size="14" text-anchor="start" font-weight="bold" fill="#6a1b9a" font-family="DejaVu Sans, Arial, sans-serif">вузол кнопки</text>
<line x1="410" y1="314" x2="410" y2="276" stroke="#00897b" stroke-width="2" stroke-linecap="round"/>
<polygon points="410.0,276.0 413.9,284.1 406.1,284.1" fill="#00897b"/>
<text x="330" y="332" font-size="13" text-anchor="start" font-weight="bold" fill="#00897b" font-family="DejaVu Sans, Arial, sans-serif">CH1 аналізатора</text>
<rect x="600" y="180" width="310" height="300" rx="14" fill="#faf5ff" stroke="#6a1b9a" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="616" y="206" font-size="15" text-anchor="start" font-weight="bold" fill="#6a1b9a" font-family="DejaVu Sans, Arial, sans-serif">Лише завдання 5: RC-фільтр</text>
<text x="616" y="226" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">Без нього: C1 знято, R2 замінено дротом</text>
<line x1="520" y1="270" x2="750" y2="270" stroke="#6a1b9a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="660" cy="270" r="5" fill="#6a1b9a"/>
<line x1="660" y1="270" x2="660" y2="360" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="638" y1="360" x2="682" y2="360" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<line x1="638" y1="372" x2="682" y2="372" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<text x="690" y="358" font-size="15" text-anchor="start" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">C1</text>
<text x="690" y="378" font-size="15" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">100 нФ</text>
<line x1="660" y1="372" x2="660" y2="520" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="750" y="258" width="90" height="24" fill="#fff6d5" stroke="#222" stroke-width="2"/>
<text x="795" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">R2  100 Ом</text>
<line x1="840" y1="270" x2="970" y2="270" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="970" y1="270" x2="970" y2="288" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="970" y1="332" x2="970" y2="350" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="970" cy="292" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
<circle cx="970" cy="328" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="958" y1="292" x2="958" y2="328" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="958" y1="310" x2="946" y2="310" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="946" y1="302" x2="946" y2="318" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="970" y1="350" x2="970" y2="520" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="988" y="316" font-size="16" text-anchor="start" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">S1</text>
<text x="988" y="336" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">тактова кнопка</text>
<line x1="306" y1="520" x2="970" y2="520" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="660" cy="520" r="5" fill="#2e7d32"/>
<circle cx="970" cy="520" r="5" fill="#2e7d32"/>
<line x1="970" y1="520" x2="970" y2="536" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="950" y1="536" x2="990" y2="536" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="958" y1="543" x2="982" y2="543" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="965" y1="550" x2="975" y2="550" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="998" y="526" font-size="15" text-anchor="start" font-weight="bold" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">спільний GND</text>
<line x1="306" y1="420" x2="370" y2="420" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="370" y="408" width="90" height="24" fill="#fff6d5" stroke="#222" stroke-width="2"/>
<text x="415" y="400" font-size="15" text-anchor="middle" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">R3  220 Ом</text>
<line x1="460" y1="420" x2="480" y2="420" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="492,402 492,438 524,420" fill="#e53935" stroke="#222" stroke-width="2"/>
<line x1="524" y1="402" x2="524" y2="438" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<line x1="480" y1="420" x2="492" y2="420" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="524" y1="420" x2="540" y2="420" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="502" y1="398" x2="514" y2="382" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="514.0,382.0 512.3,390.8 506.0,386.1" fill="#222"/>
<line x1="514" y1="398" x2="526" y2="382" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="526.0,382.0 524.3,390.8 518.0,386.1" fill="#222"/>
<line x1="540" y1="420" x2="570" y2="420" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="570" y1="420" x2="570" y2="520" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="570" cy="520" r="5" fill="#2e7d32"/>
<text x="330" y="462" font-size="13" text-anchor="start" font-weight="bold" fill="#00897b" font-family="DejaVu Sans, Arial, sans-serif">CH2 аналізатора: реакція</text>
<text x="40" y="600" font-size="15" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Навіщо саме так</text>
<text x="40" y="624" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Натискання: C1 розряджається через R2 і кнопку, τ = 100 Ом × 100 нФ = 10 мкс, тобто фронт і далі майже миттєвий.</text>
<text x="40" y="646" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Відпускання: C1 заряджається через R1, τ = 10 кОм × 100 нФ = 1 мс. Короткі розмикання під час брязкоту не встигають підняти вузол до рівня HIGH.</text>
<text x="40" y="668" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Вхід GPIO7 бачить HIGH від 0,75 × 3,3 В ≈ 2,5 В: це ≈ 1,4 τ, близько 1,4 мс після відпускання.</text>
<text x="40" y="696" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">R2 обмежує струм розряду C1 через контакти: 3,3 В / 100 Ом = 33 мА замість стрибка, який обмежує лише опір дроту.</text>
<text x="40" y="720" font-size="14" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">Не беріть GPIO35–37: на платі N16R8 вони зайняті пам'яттю PSRAM. GPIO0, 3, 45, 46 теж не для кнопки: це strapping-піни.</text>
</svg>