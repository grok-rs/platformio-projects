; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; Модуль 6, урок 6.1, ДЗ: фінальний проєкт 2.3 «Мультизадачний пристрій» задачами FreeRTOS. ESP-IDF.
; LED: червоний GPIO15, жовтий GPIO16, зелений GPIO17 (через 220 Ом на GND); BTN1 GPIO21, BTN2 GPIO18 → GND.
;   pio run -t upload && pio device monitor

[env:esp32-s3]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode  = qio
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0
