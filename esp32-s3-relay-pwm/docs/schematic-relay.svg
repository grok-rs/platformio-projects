<text x="54" y="245" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">pinMode(5, INPUT_PULLUP);</text>
<text x="54" y="263" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">attachInterrupt(5, onContact, CHANGE);</text>
<text x="54" y="281" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">t0 = micros(); digitalWrite(2, HIGH);</text>
