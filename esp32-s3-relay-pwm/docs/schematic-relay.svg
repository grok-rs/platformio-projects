<text x="1314" y="836" font-size="15" text-anchor="middle" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">E</text>
<text x="1290" y="854" font-size="12" text-anchor="middle" font-weight="normal" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">звірте з даташитом</text>
<text x="40" y="680" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Як це працює</text>
<text x="40" y="706" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">1.  GPIO2 = HIGH → VT1 відкритий → IN притягнутий до 0 В → котушка під струмом → COM перескакує з NC на NO. HIGH = реле ON.</text>
<text x="40" y="728" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">2.  NO замикається на COM = GND → GPIO5 падає в LOW. Переривання CHANGE ловить кожен фронт; час — від t0 до ПЕРШОГО фронту.</text>
<text x="40" y="750" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">3.  Через контакт тече лише ≈ 73 мкА (3,3 В / 45 кОм). Котушку (≈ 71 мА) живить транзистор модуля від MB-102, а не пін ESP32.</text>
<text x="40" y="772" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">4.  Логічний аналізатор (необов'язково): CH1 → GPIO2, CH2 → GPIO5, GND → GND — перевірка micros() незалежним приладом.</text>
<text x="40" y="808" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Перевірка перед увімкненням (перемикати лише при вимкненому живленні)</text>
<text x="40" y="832" font-size="14" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">• З клем реле знято все від «Сутінкового перемикача»: ні +5 В на COM, ні LED на NO. 5 В на GPIO5 — зіпсований пін.</text>
<text x="40" y="854" font-size="14" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">• R2 — до +5 В (не до 3V3), інакше реле не вимкнеться.   • +5 В MB-102 не йде на 5V / VIN / піни ESP32.</text>
<text x="40" y="876" font-size="14" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">• GND ESP32, «−» MB-102 і GND модуля — спільні.   • BC547B: C-B-E пласким боком до себе (у 2N2222 навпаки, E-B-C).</text>
</svg>