<text x="900" y="444" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">VT1  2N2222</text>
<text x="900" y="466" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">NPN, ключ «на землі»</text>
