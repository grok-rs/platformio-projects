<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#ffffff"/>
<text x="40" y="46" font-size="20" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">ДЗ 2: програмний ШІМ — потенціометр → GPIO4 (АЦП), GPIO6 → 2N2222 → мотор TT (5 В від MB-102)</text>
<rect x="40" y="90" width="280" height="540" rx="14" fill="#eef2f7" stroke="#334" stroke-width="2.5"/>
<text x="60" y="126" font-size="20" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">ESP32-S3</text>
<text x="60" y="148" font-size="15" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">YD-ESP32-S3 / DevKitC-1</text>
<text x="60" y="182" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">живлення: USB-C «USB» від ПК</text>
<text x="60" y="204" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">логіка 3,3 В</text>
<text x="54" y="300" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">raw = analogRead(4);</text>
<text x="54" y="317" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">high = raw * 1000 / 4095;</text>
<text x="54" y="334" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">digitalWrite(6, HIGH);</text>
<text x="54" y="351" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">delayMicroseconds(high);</text>
<text x="54" y="368" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">digitalWrite(6, LOW);</text>
<text x="54" y="385" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">delayMicroseconds(1000 - high);</text>
<text x="54" y="408" font-size="13" text-anchor="start" font-weight="bold" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">період 1000 мкс = 1 кГц</text>
<text x="54" y="502" font-size="13" text-anchor="start" font-weight="bold" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">експеримент uart-pwm:</text>
<text x="54" y="522" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">Serial1.begin(9600, SERIAL_8N1, -1, 6);</text>
<text x="54" y="539" font-size="11" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans Mono, monospace">// TX UART1 → GPIO6, той самий ключ</text>
