<text x="564" y="242" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">1 — 3V3, 3 — GND,</text>
<text x="564" y="260" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">2 (повзунок) → GPIO4</text>
