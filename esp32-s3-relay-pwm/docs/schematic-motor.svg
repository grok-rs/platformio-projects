<text x="1120" y="488" font-size="13" text-anchor="end" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">C2 100 мкФ</text>
<text x="1120" y="506" font-size="12" text-anchor="end" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">буфер 5 В</text>
<rect x="1210" y="90" width="170" height="540" rx="14" fill="#fff4f2" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="1232" y="210" font-size="20" text-anchor="start" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">MB-102</text>
<text x="1232" y="232" font-size="15" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">модуль живлення</text>
<text x="1232" y="266" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">перемичка цієї</text>
<text x="1232" y="286" font-size="14" text-anchor="start" font-weight="bold" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">сторони: 5V,</text>
