<line x1="356" y1="580" x2="1174" y2="580" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/>
<circle cx="396" cy="580" r="4.5" fill="#2e7d32"/>
<line x1="396" y1="580" x2="396" y2="594" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="378" y1="594" x2="414" y2="594" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="385" y1="600" x2="407" y2="600" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="392" y1="606" x2="400" y2="606" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="426" y="568" font-size="14" text-anchor="start" font-weight="bold" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">СПІЛЬНА ЗЕМЛЯ: GND ESP32 = «−» MB-102</text>
<text x="426" y="606" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">логічний аналізатор: CH1 → GPIO6, GND → GND</text>
<text x="1290" y="674" font-size="14" text-anchor="middle" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">2N2222, TO-92</text>
<path d="M1250,776 L1250,736 A40,40 0 0 1 1330,736 L1330,776 Z" fill="#333" stroke="#000" stroke-width="1.5"/>
<text x="1290" y="762" font-size="11" text-anchor="middle" font-weight="normal" fill="#ddd" font-family="DejaVu Sans, Arial, sans-serif">плаский бік</text>
<line x1="1266" y1="776" x2="1266" y2="818" stroke="#9e9e9e" stroke-width="3" stroke-linecap="round"/>
<text x="1266" y="836" font-size="15" text-anchor="middle" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">E</text>
<line x1="1290" y1="776" x2="1290" y2="818" stroke="#9e9e9e" stroke-width="3" stroke-linecap="round"/>
<text x="1290" y="836" font-size="15" text-anchor="middle" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">B</text>
<line x1="1314" y1="776" x2="1314" y2="818" stroke="#9e9e9e" stroke-width="3" stroke-linecap="round"/>
<text x="1314" y="836" font-size="15" text-anchor="middle" font-weight="bold" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">C</text>
<text x="1290" y="854" font-size="12" text-anchor="middle" font-weight="normal" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">звірте з даташитом</text>
<text x="40" y="680" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Як це працює</text>
<text x="40" y="706" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">1.  Повзунок дає 0…3,1 В → analogRead() = 0…4095 → tHIGH = raw · 1000 / 4095 мкс, tLOW = 1000 − tHIGH. Частка HIGH = швидкість.</text>
<text x="40" y="728" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">2.  HIGH: ≈ 11 мА бази відкривають VT1, струм іде +5 В → M1 → C → E → GND. LOW: VT1 закритий, струм обмотки мотора йде через D1.</text>
<text x="40" y="750" font-size="14" text-anchor="start" font-weight="normal" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">3.  Експеримент uart-pwm: та сама схема, GPIO6 — TX UART1. Кадр 8N1 сам задає частку HIGH: 0x00 → 10 %, 0x0F і 0x55 → 50 %, 0xFF → 90 %.</text>
<text x="40" y="786" font-size="16" text-anchor="start" font-weight="bold" fill="#112" font-family="DejaVu Sans, Arial, sans-serif">Перевірка перед увімкненням (перемикати лише при вимкненому живленні)</text>
<text x="40" y="810" font-size="14" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">• D1 смужкою до +5 В — навпаки він закоротить MB-102.   • Мотор — тільки від MB-102, не від 5V / 3V3 / пінів ESP32.</text>
<text x="40" y="832" font-size="14" text-anchor="start" font-weight="bold" fill="#7f1d1d" font-family="DejaVu Sans, Arial, sans-serif">• Вал рукою не тримати: загальмований мотор бере сотні мА, 2N2222 виходить з насичення й гріється.   • Спільна GND.</text>
<text x="40" y="854" font-size="14" text-anchor="start" font-weight="normal" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif">• Краще для мотора: логічний MOSFET AO3400A (220 Ом на затвор, 100 кОм затвор → GND) і швидкий діод 1N5819, якщо є.</text>
</svg>