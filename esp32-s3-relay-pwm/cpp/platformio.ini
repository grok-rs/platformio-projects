; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; Модуль 2.2, ДЗ «Реле, час, переривання та PWM». Одна прошивка на завдання:
;   pio run -e relay    -t upload && pio device monitor   ; ДЗ 1: час спрацювання реле (за замовчуванням)
;   pio run -e motor    -t upload && pio device monitor   ; ДЗ 2: програмний ШІМ мотора від потенціометра
;   pio run -e uart-pwm -t upload && pio device monitor   ; ДЗ 2, експеримент: UART як джерело ШІМ

[platformio]
default_envs = relay

[env]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

[env:relay]
build_src_filter = +<relay.cpp>

[env:motor]
build_src_filter = +<motor.cpp>

[env:uart-pwm]
build_src_filter = +<uart_pwm.cpp>
