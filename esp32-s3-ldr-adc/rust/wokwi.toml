# Wokwi simulation of the Rust firmware (VS Code extension "Wokwi Simulator" or wokwi-cli).
# Build first with `cargo build --release`, then F1 -> "Wokwi: Start Simulator" in this folder,
# or from the project folder: wokwi-cli rust --scenario ../wokwi/scenarios/light-levels.yaml --timeout 20000
[wokwi]
version  = 1
firmware = '../../target/xtensa-esp32s3-none-elf/release/ldr-adc'
elf      = '../../target/xtensa-esp32s3-none-elf/release/ldr-adc'

# LDR + 10 kΩ divider as a custom chip (see ../wokwi/chip/ldr-divider.chip.c).
[[chip]]
name   = 'ldr-divider'
binary = '../wokwi/chip/ldr-divider.chip.wasm'
