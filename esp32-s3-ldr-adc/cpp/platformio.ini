; PlatformIO Project Configuration
; Board: YD-ESP32-S3 (VCC-GND Studio, ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; Модуль 1.6: фоторезистор (LDR) у подільнику напруги, АЦП на GPIO4.

[env:esp32-s3-devkitc-1]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- Memory: 16 MB QIO flash + 8 MB OPI PSRAM ---------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

board_build.partitions = default_16MB.csv
board_build.f_cpu   = 240000000L
board_build.f_flash = 80000000L

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; Native USB CDC configuration
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; --- Upload / monitor ---------------------------------------------------
monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0
monitor_filters =
  esp32_exception_decoder
  time
