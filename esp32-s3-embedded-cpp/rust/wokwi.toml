# Wokwi simulation of the Rust firmware `modes`.
# Build first with `cargo build --release`, then F1 -> "Wokwi: Start Simulator" in this folder,
# or from the project folder: wokwi-cli rust --scenario ../wokwi/scenarios/modes.yaml --timeout 30000
# Tasks 1–2 instead: change `modes` to `blink` in both paths below.
[wokwi]
version  = 1
firmware = '../../target/xtensa-esp32s3-none-elf/release/modes'
elf      = '../../target/xtensa-esp32s3-none-elf/release/modes'
