[package]
name        = "embedded-cpp"
description = "ДЗ модуля 2.1: неблокуючий blink, конфігурація без магічних чисел, заміри superloop, кнопка на перериванні"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
default-run = "modes"

# cargo run --release --bin blink   — завдання 1–2
# cargo run --release               — завдання 1–4 (modes)
[[bin]]
name  = "blink"
path  = "src/bin/blink.rs"
test  = false
bench = false

[[bin]]
name  = "modes"
path  = "src/bin/modes.rs"
test  = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal.workspace                = true
esp-bootloader-esp-idf.workspace = true
esp-backtrace.workspace          = true
esp-println.workspace            = true
critical-section.workspace       = true
