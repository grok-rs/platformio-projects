; PlatformIO Project Configuration
; Board: YD-ESP32-S3 (VCC-GND Studio, ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; ДЗ модуля 2.1 «Embedded C++ на ESP32». Стенд — як у esp32-s3-led-button:
; LED на GPIO15 (+220 Ω), кнопка GPIO21 → GND (INPUT_PULLUP).
;
;   pio run -e modes -t upload   ; завдання 1–4: blink + заміри superloop + кнопка на перериванні
;   pio run -e blink -t upload   ; завдання 1–2: лише неблокуючий blink
;   pio test -e native           ; модульні тести логіки (lib/logic) на ПК, без плати

[platformio]
default_envs = modes

; Спільні налаштування прошивки. Не [env], бо тоді їх успадкувало б і середовище native.
[esp32]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- Memory: 16 MB QIO flash + 8 MB OPI PSRAM ---------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

board_build.partitions = default_16MB.csv
board_build.f_cpu   = 240000000L
board_build.f_flash = 80000000L

; Ядро Arduino 2.x за замовчуванням збирає з -std=gnu++11; C++17 дає constexpr-функції зі
; switch, неявно inline `static constexpr` члени класів і static_assert без повідомлення.
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; Native USB CDC configuration
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
; Попередження — лише для нашого коду (src/), не для ядра Arduino.
build_src_flags = -Wall -Wextra

; --- Upload / monitor ---------------------------------------------------
monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0
monitor_filters =
  esp32_exception_decoder
  time

[env:modes]
extends = esp32
build_src_filter = +<modes.cpp>

[env:blink]
extends = esp32
build_src_filter = +<blink.cpp>

; Логіка з lib/logic не знає про Arduino, тому її тести збираються звичайним g++ на ПК.
[env:native]
platform       = native
test_framework = unity
build_flags    = -std=c++17 -Wall -Wextra -Werror
