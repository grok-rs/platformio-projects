; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; ДЗ модуля 2.1 «Embedded C++ на ESP32»: LED GPIO15 (+220 Ω), кнопка GPIO21 → GND.
;   pio run -e blink -t upload && pio device monitor   ; завдання 1–2: неблокуючий blink
;   pio run -e modes -t upload && pio device monitor   ; завдання 1–4: + заміри loop() і кнопка на перериванні

[platformio]
default_envs = modes

[env]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

; ядро збирає з gnu++11; static constexpr члени структури без окремого визначення — це C++17
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

[env:blink]
build_src_filter = +<blink.cpp>

[env:modes]
build_src_filter = +<modes.cpp>
