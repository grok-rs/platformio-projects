# Wokwi simulation, env esp32-s3-devkitc-1 (one GPIO per LED).
# Build first with `pio run`, then F1 -> "Wokwi: Start Simulator".
# Single-GPIO variant: wokwi/single-gpio/wokwi.toml (F1 -> "Wokwi: Select Config File").
[wokwi]
version  = 1
firmware = '.pio/build/esp32-s3-devkitc-1/firmware.bin'
elf      = '.pio/build/esp32-s3-devkitc-1/firmware.elf'
