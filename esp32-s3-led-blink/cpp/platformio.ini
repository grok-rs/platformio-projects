; Board: YD-ESP32-S3 (ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)
; Червоний і синій LED по черзі.
;   pio run -t upload && pio device monitor                  два GPIO: GPIO4 / GPIO5
;   pio run -e single-gpio -t upload && pio device monitor   один GPIO: GPIO7

[platformio]
default_envs = esp32-s3

[env]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

[env:esp32-s3]
build_src_filter = +<two_gpio.cpp>

[env:single-gpio]
build_src_filter = +<single_gpio.cpp>
