# Wokwi simulation of the Rust firmware (one GPIO per LED).
# Build first with `cargo build --release`, then F1 -> "Wokwi: Start Simulator" in this folder,
# or from the project folder: wokwi-cli rust --scenario ../wokwi/scenarios/blink-controls.yaml --timeout 20000
# Single-GPIO variant: single-gpio/wokwi.toml.
[wokwi]
version  = 1
firmware = '../../target/xtensa-esp32s3-none-elf/release/led-blink'
elf      = '../../target/xtensa-esp32s3-none-elf/release/led-blink'
