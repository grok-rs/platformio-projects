[package]
name        = "led-blink"
description = "Червоний і синій світлодіоди по черзі: на двох GPIO або на одному"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true

# cargo run --release --bin two-gpio
[[bin]]
name  = "two-gpio"
path  = "src/bin/two_gpio.rs"
test  = false
bench = false

# cargo run --release --bin single-gpio
[[bin]]
name  = "single-gpio"
path  = "src/bin/single_gpio.rs"
test  = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal.workspace                = true
esp-bootloader-esp-idf.workspace = true
esp-backtrace.workspace          = true
esp-println.workspace            = true
