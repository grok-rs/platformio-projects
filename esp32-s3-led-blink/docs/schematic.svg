<text x="760" y="570" font-size="15" text-anchor="start" font-weight="bold" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">GPIO7 = INPUT</text>
<text x="910" y="570" font-size="15" text-anchor="start" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">→  Hi-Z: обидва вимкнені (3.3 В &lt; Vf(D2) + Vf(D1) ≈ 4.8 В)</text>
<text x="760" y="598" font-size="14" text-anchor="start" font-weight="bold" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">Лівий гребінець плати: GND — pin 1, 3V3 — pin 2, GPIO7 — pin 7.</text>
<text x="760" y="621" font-size="14" text-anchor="start" font-weight="normal" fill="#445" font-family="DejaVu Sans, Arial, sans-serif">Кадр R+B у цьому режимі — швидке перемикання HIGH/LOW (~500 Гц).</text>
