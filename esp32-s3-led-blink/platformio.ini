; PlatformIO Project Configuration
; Board: YD-ESP32-S3 (VCC-GND Studio, ESP32-S3-DevKitC-1 clone), N16R8 (16 MB Flash QIO, 8 MB PSRAM OPI)

[platformio]
default_envs = esp32-s3-devkitc-1

; Спільні налаштування для обох середовищ
[env]
platform  = espressif32@^7.1.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- Memory: 16 MB QIO flash + 8 MB OPI PSRAM ---------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

board_build.partitions = default_16MB.csv
board_build.f_cpu   = 240000000L
board_build.f_flash = 80000000L

; Arduino core 2.x compiles as gnu++11 by default; the project uses C++17.
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; Native USB CDC configuration
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; --- Upload / monitor ---------------------------------------------------
monitor_speed = 115200
; Toggle DTR/RTS on connect -> resets the S3 over USB so the boot banner shows
monitor_dtr   = 0
monitor_rts   = 0
monitor_filters =
  esp32_exception_decoder
  time

; --- Два GPIO: червоний GPIO4, синій GPIO5, зелений GPIO6 (за замовчуванням)
[env:esp32-s3-devkitc-1]

; --- Один GPIO: червоний і синій по черзі на GPIO7 -------------------------
;     pio run -e esp32-s3-single-gpio -t upload
[env:esp32-s3-single-gpio]
build_flags =
  ${env.build_flags}
  -DSINGLE_GPIO_MODE=1
